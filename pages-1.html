<link href="template/images/favicon/favicon-64x64.png" rel="icon" sizes="64x64" type="image/png">

<link href="template/css/font-awesome.min.css" rel="stylesheet">
<script src="template/js/jquery.min.js"></script>
<script>
$(function() {
  // Загрузка меню
  $('.nav-wrapper > ul').load('parts/header-menu.tpl');
  $('.connect-menu').load('parts/panel-menu.tpl');

  // Бургер-меню
  const $burger = $('.burger');
  const $sidebar = $('.sidebar-panel');
  const $closeBtn = $('.close-sidebar-panel');

  $burger.on('click', function() {
    $burger.toggleClass('active');
    $sidebar.toggleClass('active');
  });

  $closeBtn.on('click', function() {
    $sidebar.removeClass('active');
    $burger.removeClass('active');
  });

  $(window).on('resize', function() {
    $burger.removeClass('active');
    $sidebar.removeClass('active');
  });

  // Горизонтальная навигация (скролл)
  const $topContainer = $('.top-container.pages');
  const $navContainer = $('.nav-container.pages');
  const $navWrapper = $('.nav-wrapper.pages');
  const $logo = $('.nav-wrapper.pages .logo-nav');
  const $menu = $('.nav-wrapper.pages > ul');
  const $burgerBtn = $('.nav-wrapper.pages .burger');

  $(window).on('scroll', function() {
    if ($(this).scrollTop() > 100) {
      $topContainer.slideUp(100);
      $navContainer.css({ position: 'fixed', width: '100%', top: 0, 'box-shadow': '0 5px 5px rgb(133 132 157 / 40%)', transition: '.5s', 'z-index': 7777 });
      $navWrapper.css({ height: '48px', transition: '.5s' });
      $logo.css({ width: 'auto', height: '32px', display: 'inline-flex', transition: '.5s' });
      $menu.hide();
      $burgerBtn.show();
    } else {
      $topContainer.slideDown(10);
      $navContainer.css({ position: 'relative', 'box-shadow': 'none', transition: '.5s' });
      $navWrapper.css({ height: '60px', transition: '.5s' });
      $logo.css({ width: 'auto', height: '36px', display: 'none', transition: '.5s' });
      $menu.show();
      $burgerBtn.hide();
    }
  });

  // Аккордеон меню
  $('.panel-menu-level1, .panel-menu-level2').on('click', function() {
    $(this).toggleClass('active').next().slideToggle();
    return false;
  });

  // Кнопка "Наверх"
  const $topScroll = $('.top-scroll');
  $(window).on('scroll', function() {
    $topScroll.toggle($(this).scrollTop() > 300);
  });

  $topScroll.on('click', function() {
    $('html, body').animate({ scrollTop: 0 }, 800);
    return false;
  });
});
</script>


</head>
