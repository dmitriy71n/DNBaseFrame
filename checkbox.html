<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<base href="https://fm.dev.lan/">
<title>HTML Checkbox 1.0.2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="template/images/favicon/favicon.ico" rel="shortcut icon" type="image/x-icon">
<link href="template/images/favicon/favicon-32x32.png" rel="icon" sizes="32x32" type="image/png">
<link href="template/images/favicon/favicon-64x64.png" rel="icon" sizes="64x64" type="image/png">
<link href="template/css/main.css" rel="stylesheet">
<link href="template/css/fonts.css" rel="stylesheet">
<link href="template/css/font-awesome.min.css" rel="stylesheet">
</head>
<body>

<!-- Radiobutton -->
<div style="width: 50%; margin: 50px auto;">
  <div class="radiobtn">
    <input type="radio" checked class="radiobtn" name="Name Btn" value="on">
    <label for="radiobtn"></label>
  </div>

  <div class="radiobtn">
    <input type="radio" class="radiobtn" name="Name Btn" value="on">
    <label for="radiobtn"></label>
  </div>
</div>

<!-- Checkbox -->
<div style="width: 50%; margin: 50px auto;">
    <div class="checkbox">
      <input type="checkbox" checked class="checkbox" name="Name Checkbox" value="on">
      <label for="checkbox"></label>
    </div>
</div>





</body>
</html>
